{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aiagent-api.fullname" . }}-hpa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aiagent-api.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aiagent-api.fullname" . }}
  # Pod 수 범위 설정
  minReplicas: {{ .Values.autoscaling.minReplicas }}    # 최소 Pod 수 (트래픽이 없어도 2개는 유지)
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}   # 최대 Pod 수 (증가된 리소스로 더 많은 스케일링 가능)
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60    # CPU 60% 초과 시 스케일업 (더 빠른 반응)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70    # 메모리 70% 초과 시 스케일업 (안정성 향상)
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5분 안정화
      policies:
      - type: Percent
        value: 50         # 50%씩 줄임
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60   # 1분 안정화
      policies:
      - type: Percent
        value: 100        # 100%씩 늘림 (빠른 확장)
        periodSeconds: 60
{{- end }}
